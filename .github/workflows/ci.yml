name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, typecheck & tests
    runs-on: ubuntu-latest
    env:
      # No test in this job touches a live database (`prisma generate` only
      # reads schema.prisma); this dummy value just matches the postgresql
      # provider so nothing looks inconsistent in CI logs.
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Generate Next.js route types
        # Typecheck relies on the ambient PageProps/LayoutProps helpers,
        # which only exist after `next dev`, `next build`, or this — .next/
        # is gitignored so a fresh checkout has none of them yet.
        run: npx next typegen

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npx vitest run
