name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-dev-artifacts:
    name: Vérifier l'absence d'artefacts dev versionnés
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Aucun fichier de DB SQLite ou de log de dev versionné (JOB-60)
        run: |
          matches=$(git ls-files | grep -E '\.(db|db-journal|sqlite|sqlite3)$|(^|/)(npm|yarn|pnpm)-(debug|error)\.log' || true)
          if [ -n "$matches" ]; then
            echo "::error::Artefacts de dev versionnés détectés (voir JOB-60) :"
            echo "$matches"
            exit 1
          fi
          echo "OK : aucun artefact de dev versionné."

  secret-scan:
    name: Scan de secrets (gitleaks — JOB-122)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks-action exécute `git log -p SHA^..SHA` pour scanner le
          # diff de la PR : le commit parent doit être présent, ce qu'un clone
          # superficiel (fetch-depth: 1, comportement par défaut) ne garantit
          # pas. Historique complet : le plus sûr pour un scan de secrets,
          # aucun risque de retomber sur ce problème. Scopé à ce job — les
          # autres n'en ont pas besoin et n'ont pas à en payer le coût.
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    name: Lint, typecheck, tests & build
    runs-on: ubuntu-latest
    env:
      # No step in this job touches a live database (`prisma generate` only
      # reads schema.prisma, and `next build` doesn't query the DB — every
      # route in this app is dynamically rendered); this dummy value just
      # matches the postgresql provider so nothing looks inconsistent in CI
      # logs.
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
      # `prisma generate` needs directUrl set too (JOB-85 pooling split) even
      # though it never connects here.
      DIRECT_URL: "postgresql://ci:ci@localhost:5432/ci"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Generate Next.js route types
        # Typecheck relies on the ambient PageProps/LayoutProps helpers,
        # which only exist after `next dev`, `next build`, or this — .next/
        # is gitignored so a fresh checkout has none of them yet.
        run: npx next typegen

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests (avec couverture, seuil 70% — JOB-106)
        run: npm run test:coverage

      - name: Build
        # `next build` directement, pas `npm run build` : ce dernier enchaîne
        # `prisma migrate deploy`, qui a besoin d'une vraie base Postgres
        # joignable — inutile ici, ce job ne valide que la compilation.
        # `next build` ne fait aucune requête DB (aucune route statique
        # générée à partir de données).
        run: npx next build

      - name: Audit des dépendances (High/Critical — JOB-122)
        run: npm audit --audit-level=high

  integration:
    name: Tests d'intégration (Postgres réel — JOB-53)
    runs-on: ubuntu-latest
    needs: test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jobtracker
          POSTGRES_PASSWORD: jobtracker
          POSTGRES_DB: jobtracker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jobtracker"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: "postgresql://jobtracker:jobtracker@localhost:5432/jobtracker"
      # Pas de pooler dans ce service Postgres éphémère (JOB-85) : les deux
      # pointent vers la même connexion.
      DIRECT_URL: "postgresql://jobtracker:jobtracker@localhost:5432/jobtracker"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Run integration tests
        run: npm run test:integration

  e2e:
    name: Tests E2E (Playwright)
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jobtracker
          POSTGRES_PASSWORD: jobtracker
          POSTGRES_DB: jobtracker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jobtracker"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: "postgresql://jobtracker:jobtracker@localhost:5432/jobtracker"
      # Pas de pooler dans ce service Postgres éphémère (JOB-85) : les deux
      # pointent vers la même connexion.
      DIRECT_URL: "postgresql://jobtracker:jobtracker@localhost:5432/jobtracker"
      # Secret de signature JWT jetable, propre à ce run de CI — aucune
      # donnée réelle n'est en jeu (Postgres du job est lui aussi éphémère).
      AUTH_SECRET: "ci-e2e-ephemeral-signing-secret-not-for-production-use"
      # `next start` tourne en NODE_ENV=production sans plateforme connue
      # (pas de VERCEL=1) : Auth.js n'y fait pas confiance à l'origine
      # localhost par défaut sans cet opt-in explicite.
      AUTH_TRUST_HOST: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run E2E tests
        run: npm run test:e2e
